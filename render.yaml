services:
  - type: web
    name: kiwi-karlsen
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # 토큰 서명 + 비밀번호 페퍼의 근간. 절대 바꾸지 마세요(바꾸면 전원 로그아웃 + 로그인 불가).
      - key: KIWI_SECRET
        generateValue: true
      # 이 이름으로 가입/로그인하면 자동 관리자. (또는 최초 가입자)
      - key: ADMIN_USERNAME
        value: "brady"
      # 퍼즐 CSV 경로와 메모리 상한(무료 512MB → 4만 권장)
      - key: PUZZLE_FILE
        value: "data/puzzles.csv"
      - key: MAX_PUZZLES
        value: "40000"
      # 다른 도메인에서 API/WS 를 쓸 때만(쉼표 구분). 비우면 동일 출처만 허용(권장).
      - key: ALLOWED_ORIGINS
        value: ""
      # 백엔드 Stockfish 경로(선택). 비워도 브라우저 WASM 엔진이 번들돼 있음.
      - key: STOCKFISH_PATH
        value: ""
      # 영구 DB(선택). 비우면 SQLite(무료 플랜은 재배포 시 초기화).
      # - key: DATABASE_URL
      #   value: "postgresql://..."
