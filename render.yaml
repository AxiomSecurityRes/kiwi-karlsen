services:
  - type: web
    name: kiwi-karlsen
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: KIWI_SECRET
        generateValue: true
      # 백엔드 엔진을 쓰려면 Stockfish 바이너리 경로 지정 (선택).
      # 무료 플랜에서는 클라이언트 WASM 엔진만으로도 봇이 동작합니다.
      - key: STOCKFISH_PATH
        value: ""
      - key: PUZZLE_FILE
        value: "data/puzzles.csv"
